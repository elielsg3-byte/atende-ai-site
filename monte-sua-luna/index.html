  <style>
    :root {
      color-scheme: light;
      --ink: #151a17;
      --muted: #535e57;
      --line: #dce3de;
      --paper: #fcfdfa;
      --green: #114231;
      --focus: #24775a;
      --lime: #baf51c;
      font-family: "Inter", "Geist", "Segoe UI", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box }
    [hidden] { display: none !important }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 76px);
      background: #edf0ed;
      color: var(--ink);
    }
    a { color: inherit }
    button, input { font: inherit }
    a, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent }
    button { cursor: pointer }
    button:disabled { cursor: wait; opacity: .66 }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 4px }

    .shell {
      position: relative;
      isolation: isolate;
      width: min(100%, 1160px);
      min-height: clamp(580px, 77svh, 710px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(350px, 34%, 400px);
      grid-template-areas: "cover form";
      padding: 14px;
      align-items: stretch;
      border-radius: 22px;
      overflow: hidden;
      background: #18231b;
      box-shadow: 0 24px 60px #18231b24, 0 2px 8px #18231b1c;
    }
    .hero {
      grid-area: cover;
      display: flex;
      align-items: end;
      min-width: 0;
      padding: 24px clamp(20px, 4vw, 55px) 3px clamp(12px, 2.6vw, 32px);
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(0deg, #0c110ec4, transparent 45%),
        linear-gradient(22deg, #0c110e80, transparent 52%);
    }
    .testimonials { width: min(100%, 480px); color: #fff }
    .testimonials::before {
      content: "“";
      display: block;
      margin-bottom: 7px;
      height: .68em;
      color: #fff;
      font: 600 50px/.95 Georgia, serif;
    }
    .testimonial-slides { display: grid }
    .testimonial {
      grid-area: 1 / 1;
      align-self: end;
      margin: 0;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity .45s ease, transform .45s ease, visibility 0s;
    }
    .testimonial[aria-hidden="true"] {
      opacity: 0;
      visibility: hidden;
      transform: translateY(5px);
      transition: opacity .45s ease, transform .45s ease, visibility 0s .45s;
    }
    .testimonial blockquote {
      margin: 0;
      font-size: clamp(19px, 1.85vw, 27px);
      font-weight: 560;
      line-height: 1.28;
      letter-spacing: -.033em;
      text-wrap: pretty;
    }
    .testimonial figcaption { margin-top: 12px; color: #eef1ed; font-size: 13px; line-height: 1.45 }
    .testimonial-controls { display: flex; width: min(100%, 270px); gap: 8px; margin-top: 2px }
    .testimonial-controls button {
      flex: 1;
      min-width: 44px;
      height: 44px;
      border: 0;
      padding: 0;
      background: transparent;
    }
    .testimonial-controls button::after {
      content: "";
      display: block;
      height: 2px;
      border-radius: 2px;
      background: #eff7e96b;
    }
    .testimonial-controls button[aria-pressed="true"]::after { background: var(--lime) }
    .testimonial-controls button:focus-visible { outline-color: var(--lime); outline-offset: 0 }
    .workspace {
      grid-area: form;
      min-width: 0;
      min-height: 0;
      width: 100%;
      align-self: stretch;
      padding: 23px clamp(24px, 2.9vw, 42px) 14px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--paper);
      border-radius: 16px;
      box-shadow: 0 12px 38px #11161236;
    }
    .top { display: flex; align-items: center; justify-content: center; gap: 8px 12px; flex-wrap: wrap }
    .top-context { color: var(--muted); font-size: 12px; line-height: 1.35 }
    .workspace-footer { display: flex; justify-content: center }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      text-decoration: none;
      font-size: 19px;
      font-weight: 730;
      letter-spacing: -.045em;
    }
    .brand img { width: 28px; height: 28px; border-radius: 8px }
    .text-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
      text-decoration: none;
      font-size: 13px;
      font-weight: 630;
    }
    .text-action:hover {
      color: var(--green);
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .center { width: 100%; max-width: 366px; margin: 0 auto; padding: clamp(20px, 4vh, 36px) 0 18px }
    h1.step-title { margin-bottom: clamp(10px, 1.3vw, 16px); text-wrap: balance }
    h1.step-title { font-size: clamp(24px, 2.3vw, 32px); line-height: 1.16; overflow-wrap: anywhere }
    .step-description { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5 }
    .progress { margin-bottom: clamp(18px, 2vw, 24px) }
    .progress-meta {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    #counter { font-variant-numeric: tabular-nums }
    .track { height: 3px; margin-top: 8px; border-radius: 9px; overflow: hidden; background: #e6ebe8 }
    .fill { display: block; height: 100%; width: 25%; border-radius: inherit; background: #368464; transition: width .22s ease }

  <script>
    const site = 'https://www.atendeaidelivery.com.br';
    const hostname = location.hostname.toLowerCase();
    const endpoint = hostname === 'atendeaidelivery.com.br' || hostname.endsWith('.atendeaidelivery.com.br')
      ? '/api/luna' : site + '/api/luna';
    const params = new URLSearchParams(location.search);
    const PLANS = {
      basic: {key:'basic', label:'Founder Basic', price:'R$ 97', checkout:'https://pay.cakto.com.br/p3rgmzw_892813'},
      pro: {key:'pro', label:'Founder PRO', price:'R$ 167', checkout:'https://pay.cakto.com.br/fwrej9i_1220822'}
    };
    const plan = /pro/i.test(params.get('plano') || params.get('plan') || '') ? PLANS.pro : PLANS.basic;
    const utmKeys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id','src','sck'];
    const queryValues = keys => Object.fromEntries(keys.filter(key => params.has(key)).map(key => [key, params.get(key)]));
    const utm = queryValues(utmKeys);
    const quiz = queryValues(['q1','q2','q3','q4']);
    function checkoutUrl(plan) {
      const url = new URL(plan.checkout);
      for (const [key, value] of Object.entries(utm)) url.searchParams.set(key, value);
      if (!url.searchParams.has('utm_content')) url.searchParams.set('utm_content', 'monte_sua_luna');
      url.searchParams.set('fluxo', 'monte_sua_luna');
      return url.href;
    }

    const answers = {loja:'', nome:'', personalizado:'', quando:'', computador:'', ajuda:'', whatsapp:''};
    const suggestions = ['Luna','Bia','Duda','Pedro'];
    const stageNames = ['Sua atendente','Configuração','Revisão'];
    const titleCase = value => value.toLocaleLowerCase('pt-BR').replace(/(^|[\s'-])\p{L}/gu, part => part.toLocaleUpperCase('pt-BR'));
    const normalizeStore = value => {
      const letters = value.match(/\p{L}/gu) || [];
      return letters.length > 3 && value === value.toLocaleUpperCase('pt-BR') ? titleCase(value) : value;
    };
    const questions = [
      {key:'quando', label:'Início', values:['Hoje mesmo','Esta semana','Este mês','Ainda estou vendo']},
      {key:'computador', label:'Pedidos', title:'Onde você vai acompanhar os pedidos?', values:['No computador ou notebook','Só no celular']},
      {key:'ajuda', label:'Configuração', title:'Quer que a gente configure com você?', values:['Sim, quero ajuda','Não, eu mesmo configuro']}
    ];
    const attendant = () => answers.nome === 'outro' ? titleCase(answers.personalizado.trim()) : answers.nome;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[char]));
    const arrow = '<svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg>';
    const back = '<svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg>';
    const screen = document.querySelector('#screen');
    const heading = document.querySelector('#question');
    const subtitle = document.querySelector('#step-description');
    const progress = document.querySelector('.track');
    const progressSteps = [...progress.querySelectorAll('.segment')];
    let stage = 1;
    let returnToReview = false;
    let lastSentPayload = '';

    function scrollTo(element) {
      element.scrollIntoView({block:'start', behavior:'instant'});
    }

    function render(focus = true, editField = '') {
      const titles = [
        'Vamos ativar a atendente da sua loja',
        'Como ' + attendant() + ' vai trabalhar com você?',
        'Tudo certo. Falta só ativar ' + attendant() + '.'
      ];
      const subtitles = [
        'Ela vai responder seus clientes no WhatsApp, tirar pedidos e mandar tudo pronto pra cozinha.',
        'Respostas rápidas pra gente preparar tudo do seu jeito.',
        ''
      ];
      const stepText = 'Etapa ' + stage + ' de 4';
      heading.textContent = titles[stage - 1];
      subtitle.textContent = subtitles[stage - 1];
      subtitle.hidden = !subtitle.textContent;
      document.querySelector('#counter').textContent = stepText + ' · ' + stageNames[stage - 1];
      progress.setAttribute('aria-valuenow', stage);
      progress.setAttribute('aria-valuetext', stepText);
      progressSteps.forEach((step, index) => {
        step.dataset.state = index < stage - 1 ? 'done' : index === stage - 1 ? 'current' : 'future';
      });
      document.body.dataset.activationStep = String(stage);
      document.dispatchEvent(new Event('luna:stepchange'));

      if (stage === 1) renderAttendant();
      else if (stage === 2) renderSetup();
      else {
        renderReview();
        sendLead();
      }
      if (focus) {
        const target = editField && screen.querySelector(editField);
        (target || heading).focus({preventScroll:true});
        if (matchMedia('(max-width: 740px)').matches) scrollTo(document.querySelector('.workspace'));
        else if (target) scrollTo(target);
        else scrollTo(document.querySelector('.workspace'));
      }
    }

    function fieldError(id, input, message) {
      screen.querySelector('#' + id).textContent = message;
      if (message) input.setAttribute('aria-invalid', 'true');
      else input.removeAttribute('aria-invalid');
    }

    function invalid(id, input, message, anchor = input) {
      fieldError(id, input, message);
      input.focus({preventScroll:true});
      scrollTo(anchor);
    }

    function previewText() {
      const name = attendant() || 'Sua atendente';
      const store = normalizeStore(answers.loja.trim()) || 'sua loja';
      return 'Oi! ' + name + ' aqui, da equipe ' + store + ' 😊 Quer ver o cardápio?';
    }

    function actions(withBack = false) {
      return '<div class="actions">' +
        (withBack ? '<button class="text-action" type="button" data-back>' + back + ' Voltar</button>' : '') +
        '<button class="primary" type="submit">Continuar' + arrow + '</button>' +
        '</div>';
    }

    function radio(name, value, label = value, extra = '') {
      return '<label class="choice"' + (extra ? ' data-help-choice' : '') + '><input class="visually-hidden" type="radio" name="' +
        name + '" value="' + escapeHtml(value) + '"' + (answers[name] === value ? ' checked' : '') +
        '><span class="choice-copy">' + escapeHtml(label) + extra + '</span></label>';
    }

    function renderAttendant() {
      screen.innerHTML = '<form class="view" aria-labelledby="question" novalidate>' +
        '<div class="form-scroll"><div class="contact-fields"><div class="field"><label for="loja">Nome da loja</label>' +
        '<input id="loja" name="loja" type="text" minlength="2" maxlength="60" required autocomplete="organization" placeholder="Ex.: Pizzaria do Zé" aria-describedby="loja-error">' +
        '<p class="error" id="loja-error" role="alert"></p></div>' +
        '<fieldset class="name-options" aria-describedby="name-note name-error"><legend>Como ela vai se chamar?</legend><div class="chips">' +
        suggestions.map(name => radio('nome', name)).join('') + radio('nome', 'outro', '+ Outro') + '</div>' +
        '<div class="custom-name field" id="custom-name"><div><label class="sr-only" for="personalizado">Nome personalizado</label>' +
        '<input id="personalizado" name="personalizado" type="text" maxlength="20" placeholder="Ex.: Carol" aria-describedby="custom-error">' +
        '<p class="error" id="custom-error" role="alert"></p></div></div>' +
        '<p class="field-note" id="name-note">É assim que ela vai se apresentar pros seus clientes. Dá pra trocar depois.</p>' +
        '<p class="error" id="name-error" role="alert"></p></fieldset></div>' +
        '<div class="chat-preview" role="group" aria-label="Prévia da mensagem no WhatsApp"><p id="live-preview"></p></div></div>' + actions() + '</form>';

      const form = screen.querySelector('form');
      const store = form.querySelector('#loja');
      const custom = form.querySelector('#personalizado');
      const customField = form.querySelector('#custom-name');
      const firstName = form.querySelector('[name="nome"]');
      const live = form.querySelector('#live-preview');
      store.value = answers.loja;
      custom.value = answers.personalizado;

      function updateName() {
        const collapsed = answers.nome !== 'outro';
        customField.classList.toggle('is-collapsed', collapsed);
        customField.setAttribute('aria-hidden', String(collapsed));
        custom.disabled = collapsed;
        live.textContent = previewText();
      }
      updateName();
      store.addEventListener('input', () => {
        answers.loja = store.value;
        fieldError('loja-error', store, '');
        live.textContent = previewText();
      });
      custom.addEventListener('input', () => {
        answers.personalizado = custom.value;
        fieldError('custom-error', custom, '');
        live.textContent = previewText();
      });
      form.querySelector('.chips').addEventListener('change', event => {
        answers.nome = event.target.value;
        fieldError('name-error', firstName, '');
        updateName();
        if (answers.nome === 'outro') custom.focus();
      });
      form.addEventListener('submit', event => {
        event.preventDefault();
        answers.loja = normalizeStore(store.value.trim());
        answers.personalizado = titleCase(custom.value.trim());
        if (!answers.loja) return invalid('loja-error', store, 'Qual o nome da sua loja?');
        if (answers.loja.length < 2 || answers.loja.length > 60) {
          return invalid('loja-error', store, 'Usa um nome de loja com 2 a 60 caracteres.');
        }
        if (!answers.nome) return invalid('name-error', firstName, 'Escolhe um nome pra sua atendente 👆', firstName.closest('fieldset'));
        if (answers.nome === 'outro') {
          if (!answers.personalizado) return invalid('custom-error', custom, 'Qual nome você quer dar pra ela?');
          if (answers.personalizado.length > 20) return invalid('custom-error', custom, 'Usa um nome mais curto, de até 20 letras.');
        }
        stage = returnToReview ? 3 : 2;
        returnToReview = false;
        render();
      });
    }

    function phoneDigits(value) {
      const digits = value.replace(/\D/g, '');
      return value.trim().startsWith('+55') && /^55\d{10,11}$/.test(digits) ? digits.slice(2) : digits;
    }

    function formatPhone(digits) {
      if (!digits) return '';
      if (digits.length <= 2) return '(' + digits;
      const firstPartLength = digits.length >= 11 ? 5 : 4;
      const number = digits.slice(2);
      return '(' + digits.slice(0, 2) + ') ' + number.slice(0, firstPartLength) +
        (number.length > firstPartLength ? '-' + number.slice(firstPartLength) : '');
    }

    function renderSetup() {
      const phoneNote = 'Pra te avisar quando ' + attendant() + ' puder começar. O da loja você conecta depois.';
      const optionLabels = {'No computador ou notebook':'Computador ou notebook','Não, eu mesmo configuro':'Eu mesmo configuro'};
      screen.innerHTML = '<form class="view combined" aria-labelledby="question" novalidate><div class="form-scroll">' +
        questions.map(question => '<fieldset class="choices" aria-describedby="' + question.key + '-error"><legend>' +
          escapeHtml(question.title || ('Quando ' + attendant() + ' começa a atender?')) + '</legend>' +
          question.values.map(value => radio(question.key, value, optionLabels[value] || value,
            question.key === 'ajuda' && value === question.values[0] ? '<small class="choice-badge"></small>' : '')).join('') +
          '<p class="error" id="' + question.key + '-error" role="alert"></p></fieldset>' +
          (question.key === 'computador' ? '<p class="setup-note" id="setup-note" role="status"></p>' : '')).join('') +
        '<div class="field"><label for="whatsapp">Seu WhatsApp</label>' +
        '<input id="whatsapp" name="whatsapp" type="tel" inputmode="tel" required autocomplete="tel-national" placeholder="(43) 99999-9999" aria-describedby="whatsapp-note whatsapp-error">' +
        '<p class="field-note" id="whatsapp-note">' + escapeHtml(phoneNote) + '</p>' +
        '<p class="error" id="whatsapp-error" role="alert"></p></div></div>' + actions(true) + '</form>';

      const form = screen.querySelector('form');
      const phone = form.querySelector('#whatsapp');
      const note = form.querySelector('#setup-note');
      const helpChoice = form.querySelector('[data-help-choice]');
      const badge = helpChoice.querySelector('.choice-badge');
      phone.value = formatPhone(answers.whatsapp);

      function updateHelp() {
        const onlyPhone = answers.computador === 'Só no celular';
        note.textContent = onlyPhone ? 'Funciona do mesmo jeito. Pelo celular a gente configura junto com você 😉' : '';
        helpChoice.classList.toggle('recommended', onlyPhone);
        badge.textContent = onlyPhone ? 'RECOMENDADO' : 'GRÁTIS';
      }
      updateHelp();
      phone.addEventListener('input', () => {
        const position = phone.selectionStart;
        const previous = phone.value;
        answers.whatsapp = phoneDigits(phone.value);
        phone.value = formatPhone(answers.whatsapp);
        if (position !== null && position < previous.length && previous.replace(/\D/g, '') === answers.whatsapp) {
          const digitsBeforeCaret = previous.slice(0, position).replace(/\D/g, '').length;
          let offset = 0;
          let seen = 0;
          while (offset < phone.value.length && seen < digitsBeforeCaret) {
            if (/\d/.test(phone.value[offset])) seen++;
            offset++;
          }
          phone.setSelectionRange(offset, offset);
        }
        fieldError('whatsapp-error', phone, '');
      });
      form.addEventListener('change', event => {
        const {name, value, type} = event.target;
        if (type !== 'radio') return;
        answers[name] = value;
        fieldError(name + '-error', form.querySelector('[name="' + name + '"]'), '');
        if (name === 'computador') updateHelp();
      });
      form.querySelector('[data-back]').addEventListener('click', () => {
        stage = 1;
        render();
      });
      form.addEventListener('submit', event => {
        event.preventDefault();
        for (const question of questions) {
          if (answers[question.key]) continue;
          const input = form.querySelector('[name="' + question.key + '"]');
          return invalid(question.key + '-error', input, 'Escolhe uma opção aqui 👆', input.closest('fieldset'));
        }
        answers.whatsapp = phoneDigits(phone.value);
        if (!answers.whatsapp) {
          return invalid('whatsapp-error', phone, 'Informe seu WhatsApp com DDD.');
        }
        if (!/^\d{10,11}$/.test(answers.whatsapp)) {
          return invalid('whatsapp-error', phone, 'Confere o número? Precisa ter DDD, tipo (43) 99999-9999.');
        }
        stage = 3;
        returnToReview = false;
        render();
      });
    }

    function sendLead() {
      const body = JSON.stringify({
        mode:'lead',
        lead:{
          origem:'monte_sua_luna', plano:plan.key, loja:answers.loja, atendente:attendant(),
          atendente_tipo:answers.nome === 'outro' ? 'personalizado' : 'sugestao',
          whatsapp:answers.whatsapp, quando:answers.quando, computador:answers.computador,
          ajuda:answers.ajuda, nicho_demo:params.get('nicho') || null, quiz, utm,
          aparelho:matchMedia('(pointer:coarse)').matches ? 'celular' : 'computador'
        }
      });
      if (body === lastSentPayload) return;
      lastSentPayload = body;
      fetch(endpoint, {
        method:'POST', headers:{'Content-Type':'application/json'}, body, keepalive:true
      }).catch(() => {});
    }

    function renderReview() {
      const name = escapeHtml(attendant());
      const wantsHelp = answers.ajuda === questions[2].values[0];
      const rows = [
        ['Loja', answers.loja, 'loja'],
        ['Atendente', attendant(), 'nome'],
        ['Início', answers.quando === 'Ainda estou vendo' ? 'Quando você decidir' : answers.quando, 'quando'],
        ['Pedidos', answers.computador === 'Só no celular' ? 'Só no celular' : 'No computador', 'computador'],
        ['Configuração', wantsHelp ? 'Com a nossa equipe (grátis)' : 'Por conta própria', 'ajuda'],
        ['Plano', plan.label],
        ['Seu WhatsApp', formatPhone(answers.whatsapp), 'whatsapp']
      ];
      screen.innerHTML = '<section class="view review-view" aria-labelledby="question">' +
        '<details class="review-details"><summary>Sua configuração</summary><dl class="review-summary">' +
        rows.map(([label, value, field]) => '<div class="review-row"><dt>' + label + '</dt><dd>' + escapeHtml(value) + '</dd><dd>' +
          (field ? '<button class="text-action" type="button" data-edit="' + field + '" aria-label="Alterar ' + label.toLowerCase() + '">alterar</button>' : '') +
          '</dd></div>').join('') + '</dl></details>' +
        '<h2 class="review-title">Depois da ativação</h2><ul class="next-steps">' +
        '<li>O acesso ao painel chega por e-mail.</li>' +
        '<li>' + (wantsHelp ? 'Nossa equipe conecta o WhatsApp da loja com você.' : 'Conecte o WhatsApp da loja pelo QR Code.') + '</li>' +
        '<li>Pronto! ' + name + ' estará atendendo em sua loja.</li></ul>' +
        '<div class="review-payment"><strong>' + plan.price + '</strong><span>Pagamento único · Sem mensalidade pra sempre</span></div>' +
        '<p class="founder-note">Lote Founder: depois dele, a Atende.AI passa a ser por mensalidade. Quem ativa agora nunca paga mensalidade.</p>' +
        '<div class="actions"><a id="checkout" class="primary activation-button" href="' + escapeHtml(checkoutUrl(plan)) + '"><span class="button-label">Continuar para ativar ' + name + '</span>' + arrow + '</a></div>' +
        '<p class="field-note review-footnotes"><svg class="icon lock-icon" aria-hidden="true"><use href="#i-lock"></use></svg>Pagamento seguro · 120 dias de garantia</p>' +
        '</section>';

      screen.querySelector('#checkout').addEventListener('click', sendLead);
      screen.querySelectorAll('[data-edit]').forEach(button => {
        button.addEventListener('click', () => {
          const field = button.dataset.edit;
          stage = field === 'loja' || field === 'nome' ? 1 : 2;
          returnToReview = stage === 1;
          render(true, '[name="' + field + '"]');
        });
      });
    }

    render(false);
  </script>
  <script>
    const testimonialControls = document.querySelector('.testimonial-controls');
    const testimonialButtons = [...testimonialControls.querySelectorAll('button[aria-controls]')];
    const testimonialSlides = document.querySelector('.testimonial-slides');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let activeTestimonial = 0;
    let rotationTimer;

    function showTestimonial(index) {
      activeTestimonial = index;
      testimonialButtons.forEach((button, position) => {
        const selected = position === index;
        button.setAttribute('aria-pressed', String(selected));
        document.getElementById(button.getAttribute('aria-controls')).setAttribute('aria-hidden', String(!selected));
      });
    }

    function scheduleTestimonials() {
      clearTimeout(rotationTimer);
      const canRotate = document.body.dataset.activationStep !== '3' && !reducedMotion.matches && !document.hidden &&
        !testimonialControls.matches(':focus-within');
      if (canRotate) {
        rotationTimer = setTimeout(() => {
          showTestimonial((activeTestimonial + 1) % testimonialButtons.length);
          scheduleTestimonials();
        }, 2900);
      }
    }

    function updateTestimonialsForStep() {
      const review = document.body.dataset.activationStep === '3';
      testimonialControls.hidden = review;
      if (review) showTestimonial(0);
      scheduleTestimonials();
    }

    testimonialButtons.forEach((button, index) => {
      button.addEventListener('click', () => {
        showTestimonial(index);
        scheduleTestimonials();
      });
    });
    testimonialControls.addEventListener('focusin', () => {
      testimonialSlides.setAttribute('aria-live', 'polite');
      scheduleTestimonials();
    });
    testimonialControls.addEventListener('focusout', () => {
      testimonialSlides.setAttribute('aria-live', 'off');
      requestAnimationFrame(scheduleTestimonials);
    });
    reducedMotion.addEventListener('change', scheduleTestimonials);
    document.addEventListener('visibilitychange', scheduleTestimonials);
    document.addEventListener('luna:stepchange', updateTestimonialsForStep);
    updateTestimonialsForStep();
  </script>
</body>
</html>
